<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />
  <title>Tap stats</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='40' fill='%233b7de1'/><circle cx='50' cy='50' r='14' fill='white'/></svg>" />
  <link rel="stylesheet" href="portal.css" />
</head>
<!-- The page behind a church's stats link (/app/stats#<token>): read-only tap stats, no sign-in. -->
<body data-mode="shared">
  <header class="top">
    <span class="brand"><span class="dot"></span>TapDot</span>
    <span class="muted topname" id="topName"></span>
  </header>
  <main id="main" class="main"><p class="muted center">Loading…</p></main>

  <dialog id="dlg"><div id="dlgBody"></div></dialog>
  <div id="toast" class="toast" role="status"></div>
  <script src="portal.js"></script>
</body>
</html>
